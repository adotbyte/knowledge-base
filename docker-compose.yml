services:
  db:
    image: postgres:16-alpine
    container_name: knowledge_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: knowledge_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: knowledge_web
    restart: unless-stopped
    ports:
      - "3080:3000" # 3001, kad nesikirstų su portfolio (8080)
    environment:
      - DATABASE_URL=postgresql://knowledge:${DB_PASSWORD}@db:5432/knowledge_db?schema=public
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET}
      - AUTH_URL=https://knowledge.morkunas.info
      - NEXTAUTH_URL=https://knowledge.morkunas.info
      - AUTH_TRUST_HOST=true
      - AUTH_COOKIE_SECURE=true
      - AUTH_COOKIE_SAME_SITE=lax
      - NEXTAUTH_URL_INTERNAL=http://knowledge_web:3000
    depends_on:
      db:
        condition: service_started

volumes:
  postgres_data: