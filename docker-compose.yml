services:
  db:
    image: postgres:16-alpine
    container_name: knowledge_db
    restart: unless-stopped
    mem_limit: 1g # <-- Duomenų bazei pakanka 1GB
    cpus: 1.0 # <-- 1 branduolys
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: knowledge_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net

  # --- NAUJAS SAUGUS DOCKER PROXY DASHBOARD'UI ---
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: knowledge_socket_proxy
    restart: unless-stopped
    mem_limit: 64m # <-- Labai lengvas servisas
    cpus: 0.1 # <-- Jam beveik nereikia CPU
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - POST=0
    networks:
      - internal_net

  web:
    build:
      context: .
      args:
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    container_name: knowledge_web
    restart: unless-stopped
    mem_limit: 2g # <-- Daugiau RAM, nes apdoroja AI ir failus
    cpus: 2.0 # <-- 2 branduoliai, kad AI užklausos nestrigtų
    ports:
      - '3080:3000'
    volumes:
      - /proc:/host/proc:ro
      - /home/audrius/knowledge-uploads:/app/uploads
      - /tmp:/host/tmp:ro
    environment:
      - DATABASE_URL=postgresql://knowledge:${DB_PASSWORD}@db:5432/knowledge_db?schema=public
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET}
      - AUTH_TRUST_HOST=true
      - AUTH_COOKIE_SECURE=true
      - AUTH_COOKIE_SAME_SITE=lax
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_URL=${AUTH_URL}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
    depends_on:
      db:
        condition: service_started
    networks:
      - internal_net

# --- TINKLAI IR VOLUME'AI VISADA BŪNA APAČIOJE ---
networks:
  internal_net:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
