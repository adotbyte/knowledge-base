name: Deploy Knowledge Base

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    # Jei nori, kad niekada neužstrigtų amžinai, nustatome limitą
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create .env file
      run: |
        cat << 'EOF' > .env
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
        AUTH_SECRET=${{ secrets.AUTH_SECRET }}
        AUTH_GITHUB_ID=${{ secrets.AUTH_GITHUB_ID }}
        AUTH_GITHUB_SECRET=${{ secrets.AUTH_GITHUB_SECRET }}
        AUTH_URL=${{ secrets.AUTH_URL }}
        NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
        AUTH_TRUST_HOST=${{ secrets.AUTH_TRUST_HOST }}
        AUTH_COOKIE_SECURE=${{ secrets.AUTH_COOKIE_SECURE }}
        AUTH_COOKIE_SAME_SITE=${{ secrets.AUTH_COOKIE_SAME_SITE }}
        EOF

    - name: Stop old containers and Clean up
      run: |
        docker compose down --remove-orphans || true

    - name: Build and Deploy
      run: |
        docker compose up -d --build

    - name: Clean up dangling images (optional, saves disk space)
      run: |
        docker image prune -f