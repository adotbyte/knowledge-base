name: Deploy Knowledge Base

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Apply migrations
      run: npx prisma@7 migrate deploy

    - name: Create .env file
      run: |
        cat << 'EOF' > .env
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
        AUTH_SECRET=${{ secrets.AUTH_SECRET }}
        AUTH_GITHUB_ID=${{ secrets.AUTH_GITHUB_ID }}
        AUTH_GITHUB_SECRET=${{ secrets.AUTH_GITHUB_SECRET }}
        AUTH_URL=${{ secrets.AUTH_URL }}
        NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
        AUTH_TRUST_HOST=${{ secrets.AUTH_TRUST_HOST }}
        AUTH_COOKIE_SECURE=${{ secrets.AUTH_COOKIE_SECURE }}
        AUTH_COOKIE_SAME_SITE=${{ secrets.AUTH_COOKIE_SAME_SITE }}
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        EOF

    - name: Stop old containers and Clean up
      run: |
        docker compose down --remove-orphans || true

    - name: Build and Deploy
      run: |
        docker compose up -d --build

    # --- VIENINTELIS DB INICIALIZAVIMO ŽINGSNIS ---
    - name: Wait for DB and initialize schema
      run: |
        echo "Waiting for PostgreSQL to be ready..."
        sleep 5
        echo "Applying safe database schema updates..."
        # Nukopijuojame SQL failą į DB konteinerį ir jį įvykdome
        docker cp init-db.sql knowledge_db:/tmp/init-db.sql
        docker exec -i knowledge_db psql -U knowledge -d knowledge_db -f /tmp/init-db.sql || true
    # ---------------------------------------------

    - name: Clean up dangling images
      run: |
        docker image prune -f