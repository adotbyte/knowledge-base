name: Deploy Knowledge Base

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create .env file
      run: |
        cat << 'EOF' > .env
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
        AUTH_SECRET=${{ secrets.AUTH_SECRET }}
        AUTH_GITHUB_ID=${{ secrets.AUTH_GITHUB_ID }}
        AUTH_GITHUB_SECRET=${{ secrets.AUTH_GITHUB_SECRET }}
        AUTH_URL=${{ secrets.AUTH_URL }}
        NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
        AUTH_TRUST_HOST=${{ secrets.AUTH_TRUST_HOST }}
        AUTH_COOKIE_SECURE=${{ secrets.AUTH_COOKIE_SECURE }}
        AUTH_COOKIE_SAME_SITE=${{ secrets.AUTH_COOKIE_SAME_SITE }}
        EOF

    - name: Stop old containers and Clean up
      run: |
        docker compose down --remove-orphans || true

    - name: Build and Deploy
      run: |
        docker compose up -d --build

    # --- NAUJI ŽINGSNIAI ---
    - name: Wait for DB and push schema
      run: |
        sleep 10 # Palaukiame, kol PostgreSQL pilnai pasileis
        docker compose exec -T web npx prisma db push --schema=prisma/schema.prisma || true

    - name: Create Admin User
      run: |
        # Įterpiame admin vartotoją tiesiai per SQL, apeinant Prisma
        docker compose exec -T db psql -U knowledge -d knowledge_db -c "INSERT INTO \"User\" (id, name, email) VALUES ('admin', 'Admin', 'admin@example.com') ON CONFLICT (id) DO NOTHING;" || true
    # -----------------------

    - name: Clean up dangling images
      run: |
        docker image prune -f