name: Deploy Knowledge Base

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat << 'EOF' > .env
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          AUTH_GITHUB_ID=${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET=${{ secrets.AUTH_GITHUB_SECRET }}
          AUTH_TRUST_HOST=${{ secrets.AUTH_TRUST_HOST }}
          AUTH_COOKIE_SECURE=${{ secrets.AUTH_COOKIE_SECURE }}
          AUTH_COOKIE_SAME_SITE=${{ secrets.AUTH_COOKIE_SAME_SITE }}
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          AUTH_GOOGLE_ID=${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_URL=${{ secrets.AUTH_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
          EOF

      - name: Stop old containers and Clean up
        run: |
          docker compose down --remove-orphans || true

      - name: Build and Deploy
        run: |
          docker compose up -d --build

      # --- DB INICIALIZAVIMO IR PRISMA MIGRACIJŲ ŽINGSNIS ---
        - name: Wait for DB and apply Prisma schema
          run: |
            echo "Waiting for PostgreSQL to be ready..."
            sleep 5

            echo "Applying Prisma schema (db push) from within the web container..."
            docker exec -e DATABASE_URL="postgresql://knowledge:${{ secrets.DB_PASSWORD }}@db:5432/knowledge_db?schema=public" knowledge_web npx prisma@7 db push --config=prisma.config.ts || true
      # ------------------------------------------------------

      - name: Clean up dangling images
        run: |
          docker image prune -f
